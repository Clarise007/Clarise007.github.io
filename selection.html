<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarise007 — Выбор</title>
    <link rel="icon" type="image/png" href="./Clarise007.png">
    <link rel="stylesheet" href="./assets/index-xhlOusTB.css?v=local">
    <style>
        @font-face {
            font-family: 'Unbounded';
            src: url('./Unbounded-VariableFont_wght.ttf') format('truetype');
            font-weight: 200 900;
            font-display: swap;
        }
        @font-face {
            font-family: 'VkSans';
            src: url('./VKSansDisplayDemiBoldFaux.v100.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'VkSans', sans-serif;
            background-color: #0d0d0f !important;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* Сетка на фоне (как в профиле) */
        .mesh-gradient { display: none !important; }
        .noise { display: none !important; }
        .grid-background {
            background-image:
                linear-gradient(rgba(50,50,55,0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(50,50,55,0.3) 1px, transparent 1px) !important;
            background-size: 50px 50px !important;
        }
        .grid-background::after {
            background-image:
                linear-gradient(rgba(120,120,130,0.5) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(120,120,130,0.5) 1.5px, transparent 1.5px) !important;
            mask-image: radial-gradient(circle 400px at var(--mouse-x,50%) var(--mouse-y,50%), black, transparent) !important;
            -webkit-mask-image: radial-gradient(circle 400px at var(--mouse-x,50%) var(--mouse-y,50%), black, transparent) !important;
        }
        .grid-background::before {
            background: radial-gradient(circle 500px at var(--mouse-x,50%) var(--mouse-y,50%), rgba(100,100,110,0.15), transparent) !important;
        }

        /* Контейнер */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            background: var(--card-bg, rgba(15, 15, 15, 0.6));
            backdrop-filter: blur(var(--glass-blur, 24px));
            -webkit-backdrop-filter: blur(var(--glass-blur, 24px));
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.08));
            border-radius: var(--card-radius, 28px);
            padding: 40px 30px;
            text-align: center;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .container:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(20, 20, 20, 0.7);
        }

        /* Декор сверху */
        .top-decor {
            font-family: 'Unbounded', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .top-decor::before,
        .top-decor::after {
            content: '✦';
            font-size: 0.5rem;
        }

        /* Аватар */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }
        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        /* Имя */
        .name {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        /* Описание */
        .description {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Список ссылок */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .link-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateX(4px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .link-icon {
            width: 20px;
            height: 20px;
            fill: rgba(255, 255, 255, 0.5);
            flex-shrink: 0;
        }
        .link-img {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            filter: brightness(0) invert(1);
        }

        .link-text {
            font-size: 1rem;
            font-weight: 500;
            color: #fff;
            flex: 1;
            text-align: left;
        }

        .link-arrow {
            width: 16px;
            height: 16px;
            stroke: rgba(255, 255, 255, 0.3);
            fill: none;
            transition: all 0.4s ease;
        }
        .link-item:hover .link-arrow {
            stroke: rgba(255, 255, 255, 0.7);
            transform: translateX(4px);
        }

        /* Анимация */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .container { animation: fadeInUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
        .link-item {
            opacity: 0;
            animation: fadeInUp 0.7s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        .link-item:nth-child(1) { animation-delay: 0.08s; }
        .link-item:nth-child(2) { animation-delay: 0.16s; }
        .link-item:nth-child(3) { animation-delay: 0.24s; }

        /* Адаптив */
        @media (max-width: 480px) {
            body { padding: 1rem; }
            .container { padding: 30px 20px; }
            .name { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="mesh-gradient"></div>
    <div class="noise"></div>
    <div class="grid-background"></div>

    <div class="container">
        <div class="top-decor">CLARISE007</div>

        <img src="./Clarise007.png" alt="Clarise007" class="avatar">

        <h1 class="name">Clarise007</h1>
        <p class="description">Дизайнер / Создатель скинов</p>

        <div class="links">
            <!-- Профиль -->
            <a href="./index.html" class="link-item">
                <img src="./User.png" alt="Профиль" class="link-img">
                <span class="link-text">Профиль</span>
                <svg class="link-arrow" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </a>

            <!-- Обо мне -->
            <a href="./about.html" class="link-item">
                <img src="./Info.png" alt="Обо мне" class="link-img">
                <span class="link-text">Обо мне</span>
                <svg class="link-arrow" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </a>

            <!-- Telegram -->
            <a href="https://t.me/Clarise007" target="_blank" rel="noopener noreferrer" class="link-item">
                <svg class="link-icon tg-icon" viewBox="0 0 24 24" fill="#ffffff">
                    <path d="M11.944 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0h-.056zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 01.171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
                </svg>
                <span class="link-text">Telegram</span>
                <svg class="link-arrow" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('mousemove', function(e) {
            document.documentElement.style.setProperty('--mouse-x', e.clientX + 'px');
            document.documentElement.style.setProperty('--mouse-y', e.clientY + 'px');
        });
    </script>
</body>
</html>
