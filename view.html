<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/png" href="./Clarise007.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Медиатека — Clarise007</title>
<meta name="description" content="Медиатека Clarise007 — аниме, сериалы, фильмы, альбомы и игры." />
<style>
@font-face {
font-family: 'Unbounded';
src: url('./Unbounded-VariableFont_wght.ttf') format('truetype');
font-weight: 200 900;
font-display: swap;
}
@font-face {
font-family: 'VkSans';
src: url('./VKSansDisplayDemiBoldFaux.v100.ttf') format('truetype');
font-weight: 400;
font-display: swap;
}
</style>
<style>
* { box-sizing: border-box; }
body, p, span, div, a, li, input, button, h1, h2, h3, h4, h5, h6 {
font-family: 'VkSans', sans-serif;
}
body {
background-color: #0d0d0f;
color: #fff;
margin: 0;
min-height: 100vh;
padding: 1.5rem 2rem 3rem;
display: flex;
justify-content: center;
align-items: flex-start;
overflow-x: hidden;
}
/* === BACKGROUND === */
.grid-background {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 0;
background-image:
linear-gradient(rgba(50,50,55,0.3) 1px, transparent 1px),
linear-gradient(90deg, rgba(50,50,55,0.3) 1px, transparent 1px);
background-size: 50px 50px;
}
.grid-background::after {
content: '';
position: absolute;
inset: 0;
background-image:
linear-gradient(rgba(120,120,130,0.5) 1.5px, transparent 1.5px),
linear-gradient(90deg, rgba(120,120,130,0.5) 1.5px, transparent 1.5px);
background-size: 50px 50px;
mask-image: radial-gradient(circle 400px at var(--mouse-x,50%) var(--mouse-y,50%), black, transparent);
-webkit-mask-image: radial-gradient(circle 400px at var(--mouse-x,50%) var(--mouse-y,50%), black, transparent);
}
.grid-background::before {
content: '';
position: absolute;
inset: 0;
background: radial-gradient(circle 500px at var(--mouse-x,50%) var(--mouse-y,50%), rgba(100,100,110,0.15), transparent);
}
.page {
position: relative;
z-index: 1;
width: 100%;
max-width: 1120px;
margin: 0 auto;
}
/* === HEADER === */
.page-header {
display: flex;
align-items: flex-end;
justify-content: space-between;
gap: 1rem;
margin-bottom: 1.25rem;
padding: 0 0.25rem;
}
.back-link {
display: inline-flex;
align-items: center;
gap: 8px;
font-family: 'Unbounded', sans-serif;
font-size: 0.72rem;
letter-spacing: 0.06em;
text-transform: uppercase;
color: rgba(255,255,255,0.55);
text-decoration: none;
border: 1px solid rgba(255,255,255,0.1);
background: rgba(255,255,255,0.04);
padding: 10px 16px;
border-radius: 100px;
transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
white-space: nowrap;
}
.back-link:hover {
color: #fff;
background: rgba(255,255,255,0.1);
border-color: rgba(255,255,255,0.22);
transform: translateX(-3px);
}
.back-link svg { width: 15px; height: 15px; }
.page-title {
font-family: 'Unbounded', sans-serif;
font-size: clamp(1.8rem, 4vw, 2.6rem);
font-weight: 800;
letter-spacing: -0.02em;
line-height: 1.1;
margin: 0;
}
.page-sub {
color: rgba(255,255,255,0.45);
font-size: 0.98rem;
margin-top: 8px;
}
/* === CATEGORY TABS === */
.tabs-wrap {
background: rgba(15, 15, 15, 0.6);
backdrop-filter: blur(24px);
-webkit-backdrop-filter: blur(24px);
border: 1px solid rgba(255,255,255,0.08);
border-radius: 22px;
padding: 8px;
margin-bottom: 12px;
}
.tabs {
display: flex;
gap: 6px;
overflow-x: auto;
scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
display: inline-flex;
align-items: center;
gap: 8px;
border: 1px solid transparent;
background: transparent;
color: rgba(255,255,255,0.55);
padding: 11px 18px;
border-radius: 16px;
cursor: pointer;
font-family: 'Unbounded', sans-serif;
font-size: 0.82rem;
font-weight: 700;
letter-spacing: 0.02em;
white-space: nowrap;
transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
flex-shrink: 0;
}
.tab svg {
width: 17px; height: 17px;
stroke: currentColor; fill: none;
stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
flex-shrink: 0;
}
.tab:hover { color: #fff; background: rgba(255,255,255,0.06); }
.tab.active {
color: #fff;
background: rgba(255,255,255,0.12);
border-color: rgba(255,255,255,0.18);
box-shadow: 0 2px 16px rgba(0,0,0,0.35);
}
.tab-count {
font-size: 0.68rem;
font-weight: 600;
color: rgba(255,255,255,0.45);
background: rgba(255,255,255,0.07);
border-radius: 100px;
padding: 2px 7px;
}
.tab.active .tab-count { color: #fff; background: rgba(255,255,255,0.16); }
/* === SEARCH === */
.search-wrap {
display: flex;
align-items: center;
gap: 10px;
background: rgba(15, 15, 15, 0.6);
backdrop-filter: blur(24px);
-webkit-backdrop-filter: blur(24px);
border: 1px solid rgba(255,255,255,0.08);
border-radius: 22px;
padding: 3px 16px;
margin-bottom: 12px;
transition: border-color 0.35s cubic-bezier(0.23, 1, 0.32, 1);
}
.search-wrap:focus-within { border-color: rgba(255,255,255,0.22); }
.search-wrap > svg {
width: 17px; height: 17px;
stroke: rgba(255,255,255,0.45); fill: none;
stroke-width: 1.8; stroke-linecap: round;
flex-shrink: 0;
}
.search-input {
flex: 1;
min-width: 0;
background: transparent;
border: 0;
outline: none;
color: #fff;
font-size: 0.95rem;
padding: 12px 0;
}
.search-input::placeholder { color: rgba(255,255,255,0.35); }
.search-input::-webkit-search-cancel-button { display: none; }
.search-clear {
display: none;
align-items: center;
justify-content: center;
width: 26px; height: 26px;
border: 0;
border-radius: 50%;
background: rgba(255,255,255,0.08);
color: rgba(255,255,255,0.7);
cursor: pointer;
flex-shrink: 0;
font-size: 0.8rem;
line-height: 1;
transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
}
.search-clear.visible { display: flex; }
.search-clear:hover { background: rgba(255,255,255,0.16); color: #fff; }
/* === DASHBOARD === */
.dashboard {
display: grid;
grid-template-columns: minmax(0, 1fr) 300px;
gap: 12px;
align-items: start;
}
.panel {
background: rgba(15, 15, 15, 0.6);
backdrop-filter: blur(24px);
-webkit-backdrop-filter: blur(24px);
border: 1px solid rgba(255,255,255,0.08);
border-radius: 24px;
padding: 1.25rem;
}
.panel-title {
display: flex;
align-items: center;
gap: 8px;
font-family: 'Unbounded', sans-serif;
font-size: 0.68rem;
letter-spacing: 0.1em;
text-transform: uppercase;
color: rgba(255,255,255,0.5);
margin-bottom: 1rem;
}
.panel-title svg {
width: 16px; height: 16px;
stroke: #fff; fill: none; stroke-width: 1.5;
stroke-linecap: round; stroke-linejoin: round;
}
/* === CARDS === */
.cards {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
gap: 12px;
}
.media-card {
background: rgba(255,255,255,0.04);
border: 1px solid rgba(255,255,255,0.06);
border-radius: 20px;
overflow: hidden;
text-decoration: none;
color: inherit;
display: flex;
flex-direction: column;
transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
animation: cardIn 0.55s cubic-bezier(0.23, 1, 0.32, 1) both;
}
@keyframes cardIn {
from { opacity: 0; transform: translateY(16px) scale(0.97); }
to { opacity: 1; transform: translateY(0) scale(1); }
}
.media-card[data-href] { cursor: pointer; }
.media-card.is-square .media-cover { aspect-ratio: 1 / 1; }
.media-card.is-square .media-cover::after { display: none; }
.cards.square-cards { grid-template-columns: repeat(auto-fill, minmax(184px, 1fr)); }
/* игры — вертикальные баннеры: карточки уже и выше остальных */
.cards.game-cards { grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 14px; }
.media-card.is-banner .media-cover { aspect-ratio: 2 / 3; }
.dashboard.solo { grid-template-columns: minmax(0, 1fr); }
.media-card:hover {
background: rgba(255,255,255,0.07);
border-color: rgba(255,255,255,0.16);
transform: translateY(-4px);
box-shadow: 0 10px 28px rgba(0,0,0,0.4);
}
.media-cover {
position: relative;
aspect-ratio: 3 / 4;
overflow: hidden;
background:
radial-gradient(circle at 30% 20%, hsla(var(--hue), 70%, 62%, 0.85), transparent 62%),
radial-gradient(circle at 78% 82%, hsla(calc(var(--hue) + 55), 65%, 48%, 0.8), transparent 60%),
linear-gradient(160deg, hsl(var(--hue), 38%, 20%), hsl(calc(var(--hue) + 40), 32%, 9%));
}
.media-cover::after {
content: '';
position: absolute;
inset: 0;
background:
repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 14px),
linear-gradient(to top, rgba(0,0,0,0.55), transparent 55%);
}
.cover-glyph {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
color: rgba(255,255,255,0.35);
z-index: 1;
}
.cover-glyph svg {
width: 46%; height: 46%;
stroke: currentColor; fill: none;
stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round;
}
.media-cover img {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
object-fit: cover;
z-index: 2;
transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}
.media-cover img.is-icon {
object-fit: contain;
padding: 22%;
}
.media-cover img.cover-img {
opacity: 0;
transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}
.media-cover img.cover-img.loaded { opacity: 1; }
.media-card:hover .media-cover img { transform: scale(1.06); }
.media-status {
position: absolute;
left: 10px;
bottom: 10px;
z-index: 3;
display: inline-flex;
align-items: center;
gap: 6px;
padding: 5px 11px;
border-radius: 100px;
background: rgba(10,10,12,0.72);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
border: 1px solid rgba(255,255,255,0.14);
font-size: 0.72rem;
color: rgba(255,255,255,0.9);
white-space: nowrap;
}
.status-dot {
width: 6px; height: 6px; border-radius: 50%;
flex-shrink: 0;
}
.media-body {
padding: 12px 14px 14px;
display: flex;
flex-direction: column;
gap: 4px;
min-width: 0;
}
.media-title {
font-family: 'Unbounded', sans-serif;
font-size: 0.86rem;
font-weight: 700;
line-height: 1.3;
color: #fff;
}
.media-meta {
font-size: 0.82rem;
color: rgba(255,255,255,0.42);
line-height: 1.35;
}

/* === SIDEBAR === */
.sidebar { position: sticky; top: 2rem; }
.status-list { display: flex; flex-direction: column; gap: 6px; }
.status-btn {
display: flex;
align-items: center;
gap: 10px;
width: 100%;
padding: 11px 13px;
border-radius: 14px;
border: 1px solid transparent;
background: rgba(255,255,255,0.04);
color: rgba(255,255,255,0.62);
cursor: pointer;
font-size: 0.95rem;
text-align: left;
transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
}
.status-btn:hover { background: rgba(255,255,255,0.09); color: #fff; }
.status-btn.active {
background: rgba(255,255,255,0.13);
border-color: rgba(255,255,255,0.2);
color: #fff;
}
.status-btn .status-dot { width: 7px; height: 7px; }
.status-name { flex: 1; min-width: 0; }
.status-count {
font-family: 'Unbounded', sans-serif;
font-size: 0.7rem;
color: rgba(255,255,255,0.4);
font-variant-numeric: tabular-nums;
}
.status-btn.active .status-count { color: rgba(255,255,255,0.85); }
/* === EMPTY === */
.empty {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 8px;
padding: 4rem 1rem;
text-align: center;
color: rgba(255,255,255,0.35);
}
.empty svg {
width: 40px; height: 40px;
stroke: rgba(255,255,255,0.25); fill: none;
stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round;
}
.empty-title {
font-family: 'Unbounded', sans-serif;
font-size: 0.9rem;
color: rgba(255,255,255,0.55);
}
/* === RESPONSIVE === */
@media (max-width: 900px) {
body { padding: 1.25rem 1.25rem 2rem; }
.dashboard { grid-template-columns: 1fr; }
.sidebar { position: static; order: -1; }
.status-list {
flex-direction: row;
flex-wrap: wrap;
gap: 6px;
}
.status-btn { width: auto; flex: 1 1 128px; }
}
@media (max-width: 600px) {
body { padding: 1rem 0.75rem; }
.page-header { flex-direction: column; align-items: flex-start; gap: 14px; }
.cards { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.panel { padding: 1rem; border-radius: 20px; }
.media-title { font-size: 0.78rem; }
}
</style>
</head>

function catById(id) {
  return CATEGORIES.find(function (c) { return c.id === id; });
}

const collator = new Intl.Collator('ru', { sensitivity: 'base' });

/* Кириллица -> латиница только для сортировки:
   так «Кухня» встаёт рядом с K, а не отдельным блоком в конце. */
const TRANSLIT = {
  'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e', 'ё': 'e',
  'ж': 'zh', 'з': 'z', 'и': 'i', 'й': 'i', 'к': 'k', 'л': 'l', 'м': 'm',
  'н': 'n', 'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'у': 'u',
  'ф': 'f', 'х': 'h', 'ц': 'c', 'ч': 'ch', 'ш': 'sh', 'щ': 'sch', 'ъ': '',
  'ы': 'y', 'ь': '', 'э': 'e', 'ю': 'yu', 'я': 'ya'
};

function sortKey(title) {
  return title.toLowerCase().replace(/[а-яё]/g, function (ch) {
    return TRANSLIT[ch] !== undefined ? TRANSLIT[ch] : ch;
  });
}

function itemsOf(catId) {
  const items = MEDIA.filter(function (m) { return m.c === catId; });
  /* у плейлистов порядок авторский — не сортируем */
  if (catId === 'playlists') return items;
  return items.sort(function (a, b) {
    return collator.compare(sortKey(a.t), sortKey(b.t)) || collator.compare(a.t, b.t);
  });
}

/* Постеры Steam по приоритету: вертикальный 600x900 (2x, затем 1x),
   вертикальный hero capsule, и только в крайнем случае — широкий header */
function steamCover(appid) {
  return 'https://cdn.akamai.steamstatic.com/steam/apps/' + appid + '/library_600x900_2x.jpg';
}

function steamCover1x(appid) {
  return 'https://cdn.akamai.steamstatic.com/steam/apps/' + appid + '/library_600x900.jpg';
}

function steamHero(appid) {
  return 'https://cdn.akamai.steamstatic.com/steam/apps/' + appid + '/hero_capsule.jpg';
}

function steamHeader(appid) {
  return 'https://cdn.akamai.steamstatic.com/steam/apps/' + appid + '/header.jpg';
}

function steamLink(appid) {
  return 'https://store.steampowered.com/app/' + appid + '/';
}

function hueOf(title) {
  let h = 0;
  for (let i = 0; i < title.length; i++) h = (h * 31 + title.charCodeAt(i)) % 360;
  return h;
}

/* === ПОИСК (только в пределах активной категории) === */
function normText(str) {
  return str.toLowerCase().replace(/ё/g, 'е');
}

function renderCards() {
  const searching = query.trim().length > 0;
  const needle = normText(query.trim());
  const cat = catById(activeCat);
  panelTitleText.textContent = searching ? 'Поиск · ' + cat.name : cat.name;
  searchInputEl.placeholder = 'Поиск: ' + cat.name.toLowerCase();

  /* без статусов сайдбар скрыт — карточки и сетка занимают всю ширину */
  const solo = !cat.statuses.length;
  const banner = cat.id === 'games';
  dashboardEl.classList.toggle('solo', solo);
  cardsEl.classList.toggle('square-cards', solo);
  cardsEl.classList.toggle('game-cards', banner);

  const items = itemsOf(activeCat).filter(function (m) {
    if (activeStatus !== null && m.s !== activeStatus) return false;
    return !needle || normText(m.t).indexOf(needle) !== -1;
  });

  if (!items.length) {
    cardsEl.innerHTML = searching
      ? '<div class="empty" style="grid-column: 1 / -1;">' +
          ICONS.empty +
          '<div class="empty-title">Ничего не найдено</div>' +
          '<div>Попробуйте другое название</div>' +
        '</div>'
      : '<div class="empty" style="grid-column: 1 / -1;">' +
          ICONS.empty +
          '<div class="empty-title">Пока пусто</div>' +
          '<div>Здесь появятся записи категории «' + cat.name + '»</div>' +
        '</div>';
    return;
  }

  cardsEl.innerHTML = items.map(function (m, i) {
    const mcat = catById(m.c);
    /* у игр — цепочка постеров по приоритету (см. loadGameCovers) */
    const poster = m.a ? [
      m.img,
      steamCover(m.a), steamCover1x(m.a), steamHero(m.a), steamHeader(m.a)
    ].filter(Boolean) : null;
    const img = poster ? '' : (m.img || '');
    const href = m.link || (m.a ? steamLink(m.a) : '');

    const cover =
      '<span class="cover-glyph">' + ICONS[m.c] + '</span>' +
      '<img class="cover-img' + (m.icon ? ' is-icon' : '') + (img ? ' loaded' : '') + '"' +
        (img ? ' src="' + img + '"' : '') +
        (poster ? ' data-poster=\'' + JSON.stringify(poster) + '\'' : '') +
        ' alt="' + m.t + '" loading="lazy" />';

    const meta = m.desc !== undefined ? m.desc : (m.y ? '(' + m.y + ')' : mcat.name);

    const inner =
      '<div class="media-cover" style="--hue:' + hueOf(m.t) + '">' +
        cover +
        (mcat.statuses.length
          ? '<span class="media-status"><span class="status-dot" style="background:' + STATUS_COLORS[m.s] + '"></span>' + mcat.statuses[m.s] + '</span>'
          : '') +
      '</div>' +
      '<div class="media-body">' +
        '<div class="media-title">' + m.t + '</div>' +
        '<div class="media-meta">' + meta + '</div>' +
      '</div>';

    const style = ' style="animation-delay:' + Math.min(i, 8) * 30 + 'ms"';
    const dataQ = (img || poster) ? '' : ' data-q="' + (m.q || m.t) + '"';
    const cardClass = 'media-card' + (m.sq ? ' is-square' : '') + (banner ? ' is-banner' : '');
    return href
      ? '<a class="' + cardClass + '" href="' + href + '" target="_blank" rel="noopener noreferrer"' + dataQ + style + '>' + inner + '</a>'
      : '<article class="' + cardClass + '"' + dataQ +
          (m.nolink ? '' : ' data-cat="' + m.c + '" data-name="' + m.t + '"') +
          style + '>' + inner + '</article>';
  }).join('');

  loadGameCovers();
  loadCovers();
}

/* === ПОСТЕРЫ ИГР: перебор вариантов === */
function loadGameCovers() {
  Array.prototype.forEach.call(cardsEl.querySelectorAll('img.cover-img[data-poster]'), function (img) {
    let list = [];
    try { list = JSON.parse(img.dataset.poster); } catch (e) { list = []; }
    let step = 0;

    function next() {
      if (step >= list.length) { img.style.visibility = 'hidden'; return; }
      img.src = list[step++];
    }

    img.addEventListener('load', function () {
      img.classList.add('loaded');
    });
    img.addEventListener('error', next);
    next();
  });
}

/* === ОБЛОЖКИ И ССЫЛКИ === */
const infoCache = new Map();

function wikiLang(title) {
  return /[\u0400-\u04FF]/.test(title) ? 'ru' : 'en';
}

async function fetchWiki(lang, titles) {
  const out = new Map();
  const url = 'https://' + lang + '.wikipedia.org/w/api.php?action=query&format=json&origin=*'
    + '&redirects=1&prop=pageimages|pageprops&piprop=thumbnail&pithumbsize=500&pilicense=any'
    + '&titles=' + encodeURIComponent(titles.join('|'));
  let data = null;
  try {
    const res = await fetch(url);
    if (res.ok) data = await res.json();
  } catch (e) { /* без сети останутся градиентные обложки */ }

  const query = (data && data.query) || {};
  const alias = {};
  (query.normalized || []).forEach(function (n) { alias[n.from] = n.to; });
  (query.redirects || []).forEach(function (n) { alias[n.from] = n.to; });
  const pages = {};
  Object.keys(query.pages || {}).forEach(function (k) { pages[query.pages[k].title] = query.pages[k]; });

  titles.forEach(function (title) {
    let cur = title;
    for (let g = 0; alias[cur] && g < 5; g++) cur = alias[cur];
    const page = pages[cur];
    const thumb = page && page.thumbnail;
    out.set(title, {
      img: thumb ? thumb.source : null,
      imgW: thumb ? thumb.width : 0,
      imgH: thumb ? thumb.height : 0,
      qid: page && page.pageprops ? page.pageprops.wikibase_item : null
    });
  });
  return out;
}

async function fetchImdbIds(qids) {
  const out = new Map();
  for (let i = 0; i < qids.length; i += 80) {
    const chunk = qids.slice(i, i + 80);
    const query = 'SELECT ?item ?imdb WHERE { VALUES ?item { ' +
      chunk.map(function (id) { return 'wd:' + id; }).join(' ') +
      ' } ?item wdt:P345 ?imdb. }';
    const url = 'https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(query);
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const data = await res.json();
      ((data.results && data.results.bindings) || []).forEach(function (row) {
        const id = row.item.value.split('/').pop();
        out.set(id, 'https://www.imdb.com/title/' + row.imdb.value + '/');
      });
    } catch (e) { /* пропускаем — останется поиск по IMDb */ }
  }
  return out;
}

async function fetchTvmaze(name) {
  try {
    const res = await fetch('https://api.tvmaze.com/singlesearch/shows?q=' + encodeURIComponent(name));
    if (!res.ok) return null;
    const show = await res.json();
    return {
      img: show.image ? show.image.medium : null,
      imdb: show.externals && show.externals.imdb
        ? 'https://www.imdb.com/title/' + show.externals.imdb + '/'
        : null
    };
  } catch (e) {
    return null;
  }
}

async function loadCovers() {
  const cards = Array.prototype.slice.call(cardsEl.querySelectorAll('.media-card[data-q]'));
  if (!cards.length) return;

  const catByQuery = new Map();
  const nameByQuery = new Map();
  cards.forEach(function (card) {
    if (!catByQuery.has(card.dataset.q)) catByQuery.set(card.dataset.q, card.dataset.cat);
    if (!nameByQuery.has(card.dataset.q)) nameByQuery.set(card.dataset.q, card.dataset.name);
  });
  const fresh = Array.from(catByQuery.keys()).filter(function (q) { return !infoCache.has(q); });

  if (fresh.length) {
    const groups = { ru: [], en: [] };
    fresh.forEach(function (q) { groups[wikiLang(q)].push(q); });

    const found = new Map();
    for (const lang in groups) {
      const list = groups[lang];
      for (let i = 0; i < list.length; i += 20) {
        const part = await fetchWiki(lang, list.slice(i, i + 20));
        part.forEach(function (v, k) { found.set(k, v); });
      }
    }

    const qids = [];
    found.forEach(function (v) { if (v.qid) qids.push(v.qid); });
    const imdb = await fetchImdbIds(qids);
    found.forEach(function (v) { if (v.qid && imdb.has(v.qid)) v.imdb = imdb.get(v.qid); });

    // У Википедии у сериалов вместо постера часто лежит логотип (широкая картинка),
    // поэтому сериалы и аниме, где нет вертикального постера, дозапрашиваем с TVmaze
    const shows = fresh.filter(function (q) {
      const cat = catByQuery.get(q);
      if (cat !== 'series' && cat !== 'anime') return false;
      const v = found.get(q);
      const portrait = v && v.imgW && v.imgH && v.imgH > v.imgW * 1.05;
      return !portrait;
    });
    for (let i = 0; i < shows.length; i += 5) {
      const chunk = shows.slice(i, i + 5);
      const res = await Promise.all(chunk.map(function (q) { return fetchTvmaze(nameByQuery.get(q)); }));
      chunk.forEach(function (q, k) {
        const show = res[k];
        if (!show) return;
        const info = found.get(q) || {};
        if (show.img) info.img = show.img;
        if (show.imdb) info.imdb = show.imdb;
        found.set(q, info);
      });
      if (i + 5 < shows.length) await new Promise(function (r) { setTimeout(r, 2200); });
    }

    found.forEach(function (v, k) { infoCache.set(k, v); });
  }

  cards.forEach(function (card) {
    const info = infoCache.get(card.dataset.q) || {};

    const img = card.querySelector('.cover-img');
    if (img && info.img && !img.getAttribute('src')) {
      img.addEventListener('load', function () {
        if (img.naturalWidth > img.naturalHeight * 1.1) img.classList.add('is-icon');
        img.classList.add('loaded');
      });
      img.src = info.img;
    }

    const linked = card.dataset.cat === 'movies' || card.dataset.cat === 'series' || card.dataset.cat === 'anime';
    if (card.tagName !== 'A' && linked) {
      card.dataset.href = info.imdb
        || 'https://www.imdb.com/find/?q=' + encodeURIComponent(card.dataset.name || '');
    }
  });
}

  renderStatuses();
  renderCards();
  searchInputEl.focus();
});

statusListEl.addEventListener('click', function (e) {
  const btn = e.target.closest('.status-btn');
  if (!btn) return;
  activeStatus = btn.dataset.status === 'all' ? null : Number(btn.dataset.status);
  renderStatuses();
  renderCards();
});

cardsEl.addEventListener('click', function (e) {
  const card = e.target.closest('.media-card');
  if (!card || card.tagName === 'A' || !card.dataset.href) return;
  window.open(card.dataset.href, '_blank', 'noopener');
});

document.addEventListener('mousemove', function (e) {
  document.documentElement.style.setProperty('--mouse-x', e.clientX + 'px');
  document.documentElement.style.setProperty('--mouse-y', e.clientY + 'px');
});

renderAll();
</script>
</body>
</html>
