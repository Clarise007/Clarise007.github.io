  top.appendChild(content);

  /* Project cards */
  var projects = document.createElement('div');

  /* Row 1: Rc-Pattern + Diskord */
  var row1 = document.createElement('div');
  row1.className = 'project-row';

    { name: 'Rc-Pattern', desc: 'Стиль, который заметят все', img: './Avatar Rc-Pattern.png', url: 'https://playerok.com/profile/RcPattern/products' },

      '<img class="project-img" src="' + p.img + '" alt="' + p.name + '" />' +
      '<div class="project-info">' +
        '<span class="project-name">' + p.name + ' ' + EXTERNAL_LINK_SVG + '</span>' +
        '<span class="project-desc">' + p.desc + '</span>' +

    row1.appendChild(card);

  /* Row 2: Claray — full width with social buttons */
  var clarayCard = document.createElement('div');
  clarayCard.className = 'claray-card';
  clarayCard.innerHTML =
    '<img class="project-img" src="./Claray.png" alt="Claray" />' +
    '<div class="project-info">' +
      '<span class="project-name">Claray ' + EXTERNAL_LINK_SVG + '</span>' +
      '<span class="project-desc">Два человека. Одна общая цель</span>' +
    '</div>' +
    '<div class="claray-socials">' +
      '<a class="claray-social-btn" href="https://discord.gg/DrugCtPr3g" target="_blank" title="Discord">' + DISCORD_SVG + '</a>' +
      '<a class="claray-social-btn" href="https://t.me/Claray_Disign?direct" target="_blank" title="Telegram">' + TELEGRAM_SVG + '</a>' +
    '</div>';

  projects.appendChild(row1);
  projects.appendChild(clarayCard);

  merged.appendChild(top);
  merged.appendChild(projects);
  block.appendChild(merged);
}

/* === MAIN === */
function customizeContent() {
  var container = document.querySelector('.bento-container');
  if (!container) return false;
  var items = container.querySelectorAll('.bento-item');
  if (items.length < 8) return false;

  var positions = [
    { col: '1 / 3', row: '2' },
    { col: '2 / 4', row: '1' },
    { col: '3',     row: '2' },
    { col: '1',     row: '1' },
    { col: '1',     row: '3' },
    { col: '1',     row: '3' },
    { col: '2 / 4', row: '3' },
    { col: '1',     row: '3' },
  ];

  items.forEach(function(item, i) {
    if (i < positions.length) {
      item.style.gridColumn = positions[i].col;
      item.style.gridRow = positions[i].row;
    }
    if (i === 5 || i === 7) {
      item.style.display = 'none';
      return;
    }
  });

  rebuildProfile(items[0]);
  rebuildSpotify(items[1]);
  rebuildGames(items[2]);
  rebuildAbout(items[3]);
  rebuildQuote(items[6]);

  /* LOCAL TIME — add class for targeted styling */
  items.forEach(function(item) {
    var label = item.querySelector('.label');
    if (label && (label.textContent.indexOf('LOCAL TIME') !== -1 || label.textContent.indexOf('Local Time') !== -1)) {
      label.classList.add('local-time-label');
      item.querySelectorAll('div, span').forEach(function(el) {
        el.style.fontFamily = "'Unbounded', sans-serif";
      });
    }
  });

  container.classList.add('customized');
  return true;
}

function init() {
  var root = document.getElementById('root');
  if (!root) { setTimeout(init, 200); return; }
  var observer = new MutationObserver(function() {
    if (root.querySelectorAll('.bento-item').length >= 8) {
      customizeContent();
      observer.disconnect();
    }
  });
  observer.observe(root, { childList: true, subtree: true });
  setTimeout(customizeContent, 500);
  setTimeout(customizeContent, 1500);
  setTimeout(customizeContent, 3000);
}

init();
</script>
